version: "2"
run:
  concurrency: 8
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - gocognit
    - goconst
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - appendCombine
        - badCall
        - badCond
        - boolExprSimplify
        - codegenComment
        - commentFormatting
        - commentedOutCode
        - deprecatedComment
        - dupImport
        - emptyFallthrough
        - emptyStringTest
        - equalFold
        - evalOrder
        - exitAfterDefer
        - flagName
        - hexLiteral
        - indexAlloc
        - initClause
        - methodExprCall
        - nestingReduce
        - newDeref
        - nilValReturn
        - offBy1
        - ptrToRefParam
        - rangeExprCopy
        - regexpPattern
        - sloppyReassign
        - stringXbytes
        - truncateCmp
        - typeAssertChain
        - typeUnparen
        - underef
        - unnecessaryBlock
        - valSwap
        - weakCond
        - wrapperFunc
        - yodaStyleExpr
    gocyclo:
      min-complexity: 10
    nestif:
      min-complexity: 8
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    # PBI #426 (feature #417): no new importers of the deprecated legacy data
    # engine. The `$` anchor was verified on v2.14.0: it matches the engine
    # package exactly and provably ignores the live /data/models and
    # /data/interfaces imports. CI lane: go-legacy-guard.yml (--enable-only
    # keeps pre-existing lint debt out of it). Grandfathered paths below.
    depguard:
      rules:
        main:
          desc: "PBI #426 — no new importers of the deprecated legacy data engine (removal issue links here)"
          files: ["**/*"]
          deny:
            - pkg: github.com/Parallels/prl-devops-service/data$
              desc: "legacy JSON data layer is deprecated (#426): use serviceprovider.GetDatabaseService()/interfaces.DatabaseService; see removal issue"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
          - gosec
        path: .*_test\.go
      # ---- #426 grandfather (feature #417): the importers that legitimately
      # exist at landing. Generated 2026-11-12 at 7a60e39 by the task-03 audit
      # command (grep -rln '"github.com/…/data"' src --include='*.go' |
      # grep -v '^src/data/' | sed 's|^src/||; s|/[^/]*\.go$|/**|' | sort -u),
      # each pattern anchored. Verified on v2.14.0: reported paths are
      # config-dir-relative, so every pattern carries the src/ prefix (and
      # serviceprovider/ covers its parallelsdesktop/ subtree — the audit's
      # nested duplicate collapsed). The removal issue owns shrinking this
      # list to zero — never add an entry to fix a new import.
      - linters: [depguard]
        path: ^src/data/ # self-exclusion (always-list): the package lives here
      - linters: [depguard]
        path: ^src/catalog/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/cmd/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/controllers/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/database/legacy_migrator/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/database/parity/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/database/query/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/database/testutil/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/integration_test/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/orchestrator/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/restapi/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/serviceprovider/ # #426 grandfather (incl. parallelsdesktop/) — shrink via removal issue
      - linters: [depguard]
        path: ^src/startup/migrations/ # #426 grandfather (AD-4) — shrink via removal issue
      - linters: [depguard]
        path: ^src/startup/seeds/ # #426 grandfather — shrink via removal issue
      - linters: [depguard]
        path: ^src/tests/controllers/ # #426 grandfather — shrink via removal issue
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
