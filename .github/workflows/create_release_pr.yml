name: Create release PR

run-name: Create release PR for new ${{ github.event.inputs.version }} version

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: choice
        description: "What type of release is this"
        options:
          - "major"
          - "minor"
          - "patch"

jobs:
  create-release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NEW_VERSION: "" # will be set in the workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Setup Go 1.21.x
        uses: actions/setup-go@v4
        with:
          go-version: "1.21.x"
          cache-dependency-path: ${{ github.workspace }}/src/go.sum

      # ── Compute next version ───────────────────────────────────────────────
      - name: Compute next version
        id: version
        run: |
          NEW_VERSION=$(./.github/workflow_scripts/increment-version.sh -t ${{ inputs.version }} -f VERSION)
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      # ── Create release branch ──────────────────────────────────────────────
      - name: Create release branch
        run: |
          git config --global user.email "cjlapao@gmail.com"
          git config --global user.name "cjlapao"
          git checkout -b release/${{ env.NEW_VERSION }}

      # ── Bump version files and regenerate docs ─────────────────────────────
      - name: Bump version and generate docs
        run: |
          echo "${{ env.NEW_VERSION }}" > ./VERSION
          sed -i "/^version:/c\version: \"${{ env.NEW_VERSION }}\"" ./helm/Chart.yaml
          sed -i "/^appVersion:/c\appVersion: \"${{ env.NEW_VERSION }}\"" ./helm/Chart.yaml
          sed -i "/^var ver =/c\\var ver = \"${{ env.NEW_VERSION }}\"" ./src/main.go
          sed -i "/^\/\/	@version/c\\//	@version ${{ env.NEW_VERSION }}" ./src/main.go

          go install github.com/swaggo/swag/cmd/swag@latest

          # Update dependencies
          cd src && go mod tidy && cd ..

          # Generate all documentation (Swagger, Postman, API Reference)
          make generate-all-docs

          # Generate blog records for the new version
          ./.github/workflow_scripts/generate-blog-records.sh

          # Generate Helm Chart
          make build-helm-chart

      # ── Generate changelog ─────────────────────────────────────────────────
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ secrets.PARALLELS_WORKFLOW_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x ./.github/workflow_scripts/generate-changelog.sh
          ./.github/workflow_scripts/generate-changelog.sh \
            --mode GENERATE \
            --repo ${{ github.repository }} \
            --version ${{ env.NEW_VERSION }} \
            --verbose

      # ── Commit and push ────────────────────────────────────────────────────
      - name: Commit and push release branch
        run: |
          git add VERSION CHANGELOG.md \
            ./src/main.go ./src/go.mod ./src/go.sum ./src/docs/* \
            ./helm/Chart.yaml \
            ./docs/charts/* ./docs/_posts/* \
            ./docs/Parallels_Desktop_API.postman_collection.json \
            ./docs/docs/devops/restapi/reference/*

          git add -u ./src/

          git commit -m "Release extension version ${{ env.NEW_VERSION }}"

          git push --set-upstream origin release/${{ env.NEW_VERSION }}

      # ── Generate PR body ───────────────────────────────────────────────────
      - name: Generate release PR body
        env:
          GH_TOKEN: ${{ secrets.PARALLELS_WORKFLOW_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x ./.github/workflow_scripts/generate-changelog.sh
          ./.github/workflow_scripts/generate-changelog.sh \
            --mode RELEASE \
            --repo ${{ github.repository }} \
            --version ${{ env.NEW_VERSION }} \
            --output-to-file \
            --file release_notes.md \
            --verbose

      # ── Open pull request ──────────────────────────────────────────────────
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.PARALLELS_WORKFLOW_PAT }}
        run: |
          gh pr create \
            --title "Release version ${{ env.NEW_VERSION }}" \
            --body-file release_notes.md \
            --base main \
            --head release/${{ env.NEW_VERSION }} \
            --label release-request
