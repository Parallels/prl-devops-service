name: Dev Preview Deploy

# CONVENTIONS (dev branch workflow):
# - Fast staging test lane for code on `dev`: builds ghcr.io/parallels/prl-devops-service:dev-<sha>
#   and deploys it to stg. No GitHub release, no version bump, no changelog,
#   no Discord announcement, and `:latest` is untouched.
# - Run this workflow from the `dev` ref. The Helm chart still comes from `main`
#   (see the header comment in deploy-aks.yml) — chart changes take effect for
#   staging only after they are integrated into `main`.
# - Closer-to-production cycles remain available by dispatching
#   release_beta.yml / release_canary.yml from the `dev` ref.

on:
  workflow_dispatch:
    inputs:
      deploy_orchestrator:
        description: "Deploy Orchestrator"
        required: false
        type: boolean
        default: true
      deploy_catalog:
        description: "Deploy Catalog"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: dev-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build preview image (linux/${{ matrix.arch }})
    # One job per architecture, each on a native runner for that architecture:
    # no QEMU emulation, so the arm64 leg is no longer a fraction of amd64
    # speed. Images are pushed by digest only; publish-preview below assembles
    # them into the tagged multi-arch preview image.
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE_REPOSITORY: ghcr.io/parallels/prl-devops-service
      AmplitudeApiKey: ${{ secrets.AMPLITUDE_API_KEY }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute preview short SHA
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=dev-${{ steps.tag.outputs.short_sha }}
            BUILD_ENV=dev
            GIT_COMMIT=${{ github.sha }}
          secrets: |
            amplitude_api_key=${{ secrets.AMPLITUDE_API_KEY }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

  publish-preview:
    name: Publish multi-arch preview image
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/parallels/prl-devops-service
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Compute preview tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Collect platform digests
        id: digests
        uses: actions/github-script@v7
        with:
          script: |
            // Matrix job outputs are aggregated into one JSON object keyed by
            // matrix value; pull the manifest digests out of it.
            const raw = `${{ needs.build-preview.outputs.digest }}`
            const digests = [...new Set(raw.match(/sha256:[a-f0-9]{64}/g) || [])]
            if (digests.length !== 2) {
              core.setFailed(`Expected 2 platform digests, got ${digests.length}: ${raw}`)
              return
            }
            core.setOutput('digests', digests.join(','))

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge platform images into multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          keep-gitcontext: false
          digests: ${{ steps.digests.outputs.digests }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}

  deploy-stg:
    name: Deploy preview to staging
    needs: publish-preview
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy workflow on main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-aks.yml',
              ref: 'main',
              inputs: {
                environment: 'stg',
                image_tag: '${{ needs.publish-preview.outputs.image_tag }}',
                namespace: 'prl-devops-services',
                deploy_orchestrator: "${{ inputs.deploy_orchestrator && 'true' || 'false' }}",
                deploy_catalog: "${{ inputs.deploy_catalog && 'true' || 'false' }}"
              }
            });
            console.log('Dispatched deploy-aks.yml on main for stg with tag ${{ needs.publish-preview.outputs.image_tag }}');
